name: Release

# Creates a GitHub release with the packaged .vsix whenever a `v*` tag is pushed.
# Can also be run manually (builds the version from package.json).
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Optional: if the secret VSCE_PAT is configured, the extension is also
# published to the VS Code Marketplace automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate tag against package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$TAG does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Generate themes
        run: bun run src/index.ts

      - name: Package extension
        run: npx vsce package

      - name: Check the .vsix exists
        run: test -f "sham-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Sham ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "sham-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to the Marketplace (optional)
        if: env.VSCE_PAT != ''
        run: npx vsce publish --pat "$VSCE_PAT"
